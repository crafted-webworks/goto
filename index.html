<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12121a;
    --ink-2: #191922;
    --panel: #1d1d28;
    --panel-2: #232332;
    --line: #2c2c3a;
    --paper: #f5f3ee;
    --paper-dim: #a9a8b3;
    --paper-faint: #6f6e7a;
    --accent: #7c9eff;
    --accent-dim: #3d4d8c;
    --live: #4ade80;
    --demo: #fbbf24;
    --sample: #38bdf8;
    --upcoming: #c084fc;
    --expired: #6b7280;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  html[data-theme="light"] {
    --ink: #f5f3ee;
    --ink-2: #ebe8e0;
    --panel: #ffffff;
    --panel-2: #f0eee7;
    --line: #ddd9cf;
    --paper: #1c1b1f;
    --paper-dim: #55535c;
    --paper-faint: #8a8790;
    --accent: #4a63c9;
    --accent-dim: #c9d3f5;
    --live: #16a34a;
    --demo: #b45309;
    --sample: #0284c7;
    --upcoming: #9333ea;
    --expired: #6b7280;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font-body);
    background: var(--ink);
    color: var(--paper);
    display: flex;
    justify-content: center;
    padding: 48px 24px;
    position: relative;
    overflow-x: hidden;
  }

  body.centered { align-items: center; }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 42px 42px;
    opacity: 0.22;
    pointer-events: none;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, black, transparent);
  }

  a { color: inherit; }

  /* theme toggle */
  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--paper-faint);
  }

  .theme-switch {
    width: 40px;
    height: 22px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--line);
    cursor: pointer;
    position: relative;
    padding: 0;
    flex-shrink: 0;
  }

  .theme-switch-knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    transition: transform 0.2s ease;
  }

  html[data-theme="light"] .theme-switch-knob {
    transform: translateX(18px);
  }

  .scene {
    width: 100%;
    max-width: 460px;
    position: relative;
    z-index: 1;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--paper-dim);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }

  .eyebrow .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,158,255,0.15);
  }

  /* ---------- REDIRECT VIEW ---------- */

  .router-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 36px 32px 30px;
  }

  .router-card h1 {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .router-card .sub {
    font-size: 14px;
    color: var(--paper-dim);
    margin: 0 0 28px;
  }

  .path-track {
    position: relative;
    height: 2px;
    background: var(--line);
    border-radius: 2px;
    margin: 34px 0 30px;
  }

  .path-fill {
    position: absolute;
    inset: 0;
    width: 0%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    border-radius: 2px;
    animation: fillTrack 1.5s cubic-bezier(.4,0,.2,1) forwards;
  }

  .path-node {
    position: absolute;
    top: 50%;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px 2px rgba(124,158,255,0.6);
    transform: translate(-50%, -50%);
    left: 0%;
    animation: travelNode 1.5s cubic-bezier(.4,0,.2,1) forwards;
  }

  .path-node::after {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1px solid rgba(124,158,255,0.4);
    animation: pulseRing 1.2s ease-out infinite;
  }

  @keyframes fillTrack { to { width: 100%; } }
  @keyframes travelNode { to { left: 100%; } }
  @keyframes pulseRing {
    0% { transform: scale(0.6); opacity: 0.8; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  .endpoints {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--paper-dim);
    margin-top: -22px;
  }
  .endpoints span:last-child { color: var(--paper); text-align: right; max-width: 60%; }

  .route-meta {
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .route-name {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
  }

  .status-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid transparent;
    flex-shrink: 0;
  }
  .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; }

  .status-pill.live {
    background: rgba(74,222,128,0.1);
    color: var(--live);
    border-color: rgba(74,222,128,0.3);
  }
  .status-pill.live .dot { background: var(--live); box-shadow: 0 0 6px rgba(74,222,128,0.8); }

  .status-pill.demo {
    background: rgba(251,191,36,0.1);
    color: var(--demo);
    border-color: rgba(251,191,36,0.3);
  }
  .status-pill.demo .dot { background: var(--demo); }

  .status-pill.sample {
    background: rgba(56,189,248,0.1);
    color: var(--sample);
    border-color: rgba(56,189,248,0.3);
  }
  .status-pill.sample .dot { background: var(--sample); box-shadow: 0 0 6px rgba(56,189,248,0.6); }

  .status-pill.upcoming {
    background: rgba(192,132,252,0.1);
    color: var(--upcoming);
    border-color: rgba(192,132,252,0.3);
  }
  .status-pill.upcoming .dot { background: var(--upcoming); box-shadow: 0 0 6px rgba(192,132,252,0.6); }

  .status-pill.expired {
    background: rgba(107,114,128,0.12);
    color: var(--expired);
    border-color: rgba(107,114,128,0.3);
  }
  .status-pill.expired .dot { background: var(--expired); }

  .route-item.status-expired,
  .route-item.status-upcoming {
    opacity: 0.7;
  }
  .route-item.status-expired .row-name,
  .route-item.status-upcoming .row-name {
    color: var(--paper-dim);
  }

  .manual-link {
    margin-top: 20px;
    font-size: 12px;
    color: var(--paper-dim);
    text-align: center;
  }
  .manual-link a { color: var(--accent); text-decoration: none; }
  .manual-link a:hover { text-decoration: underline; }

  /* ---------- DIRECTORY VIEW ---------- */

  .directory {
    display: none;
    width: 100%;
    max-width: 640px;
  }

  .directory-head h1 {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .directory-head p {
    font-size: 14px;
    color: var(--paper-dim);
    margin: 0 0 22px;
    max-width: 50ch;
    line-height: 1.5;
  }
  .directory-head p code {
    font-family: var(--font-mono);
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--accent);
    font-size: 12.5px;
  }

  /* tag filter bar */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 22px;
  }

  .tag-chip {
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.02em;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--paper-dim);
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }
  .tag-chip:hover { border-color: var(--accent-dim); color: var(--paper); }
  .tag-chip.active {
    background: rgba(124,158,255,0.12);
    border-color: var(--accent);
    color: var(--accent);
  }
  .tag-chip .count {
    color: var(--paper-faint);
    margin-left: 4px;
  }
  .tag-chip.active .count { color: var(--accent-dim); }

  .route-table {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .route-item {
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
    overflow: hidden;
    transition: border-color 0.15s ease;
  }
  .route-item.faded { opacity: 0.35; }

  .route-row {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding: 16px 18px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .route-row:hover { background: var(--ink-2); }

  .row-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .row-index {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--paper-dim);
    width: 20px;
    flex-shrink: 0;
    padding-top: 2px;
  }

  .row-logo {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #ffffff;
    border: 1px solid var(--line);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 4px;
  }
  .row-logo img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .row-main { flex: 1; min-width: 0; }

  .row-name {
    font-family: var(--font-display);
    font-size: 15.5px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 3px;
  }

  .row-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-left: 32px;
    flex-wrap: wrap;
  }

  .row-badges {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .row-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: auto;
  }

  .type-badge {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.03em;
    color: var(--paper-dim);
    background: var(--panel-2);
    border: 1px solid var(--line);
    padding: 3px 9px;
    border-radius: 6px;
    white-space: nowrap;
  }

  .row-url {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--paper-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row-toggle {
    font-family: var(--font-mono);
    color: var(--paper-faint);
    opacity: 0.8;
    transition: transform 0.2s ease;
    flex-shrink: 0;
    font-size: 12px;
  }
  .route-item.open .row-toggle { transform: rotate(90deg); color: var(--accent); }

  /* expandable detail panel */
  .route-detail {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
    border-top: 1px solid transparent;
  }
  .route-item.open .route-detail {
    max-height: 400px;
    border-top: 1px solid var(--line);
  }

  .route-detail-inner {
    padding: 16px 18px 18px;
  }

  .detail-desc {
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--paper-dim);
    margin: 0 0 14px;
  }

  .detail-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    align-items: flex-start;
  }
  .detail-row:last-child { margin-bottom: 0; }

  .detail-label {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--paper-faint);
    width: 62px;
    flex-shrink: 0;
    padding-top: 3px;
  }

  /* case study sub-section */
  .case-study-toggle {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--accent);
    cursor: pointer;
    padding: 7px 12px;
    margin: 2px 0 4px;
    border: 1px solid var(--accent-dim);
    border-radius: 8px;
    background: rgba(124,158,255,0.05);
    user-select: none;
    transition: background 0.15s ease;
  }
  .case-study-toggle:hover { background: rgba(124,158,255,0.1); }
  .case-study-toggle .chev { transition: transform 0.2s ease; font-size: 10px; }
  .case-study-toggle.open .chev { transform: rotate(90deg); }

  .case-study-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }
  .case-study-body.open { max-height: 900px; }

  .case-study-inner {
    font-size: 13px;
    line-height: 1.65;
    color: var(--paper-dim);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 4px 0 14px;
    white-space: pre-line;
  }
  .case-study-inner strong { color: var(--paper); }

  .tool-list, .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tool-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--paper);
    padding: 3px 9px;
    border-radius: 6px;
  }

  .tag-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    background: rgba(124,158,255,0.08);
    border: 1px solid var(--accent-dim);
    padding: 3px 9px;
    border-radius: 6px;
  }

  .row-tag-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent);
    background: rgba(124,158,255,0.08);
    border: 1px solid var(--accent-dim);
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .no-results {
    text-align: center;
    padding: 40px 20px;
    color: var(--paper-faint);
    font-size: 13.5px;
    border: 1px dashed var(--line);
    border-radius: 14px;
  }

  .directory-foot {
    margin-top: 18px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--paper-dim);
    text-align: center;
  }

  /* direct-go rows: name + Go button only, no expand */
  .route-row.direct-row .row-toggle { display: none; }

  .go-btn {
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.04em;
    color: var(--ink);
    background: var(--accent);
    padding: 7px 14px;
    border-radius: 8px;
    text-decoration: none;
    flex-shrink: 0;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .go-btn:hover { background: #93aeff; }
  .go-btn:active { transform: scale(0.97); }

  .info-toggle {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--paper-faint);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .route-item.open .info-toggle { color: var(--accent); }
  .info-toggle .row-toggle { font-size: 12px; }

  .hold-banner {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--paper-faint);
    text-align: center;
    margin-bottom: 14px;
  }
  .hold-banner a { color: var(--accent); text-decoration: none; }
  .hold-banner a:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    .router-card { padding: 28px 22px 24px; }
    .detail-label { width: 54px; }
    .row-bottom { padding-left: 0; }
    .theme-toggle { top: 14px; right: 14px; }
    body { padding-top: 56px; }
  }
</style>
</head>
<body class="centered" id="body">

<div class="theme-toggle">
  <span id="themeLabel">dark</span>
  <button class="theme-switch" id="themeSwitch" aria-label="Toggle light/dark theme">
    <span class="theme-switch-knob"></span>
  </button>
</div>

<!-- REDIRECT VIEW -->
<div class="scene" id="redirectScene" style="display:none;">
  <div class="eyebrow"><span class="dot"></span> ROUTING</div>
  <div class="router-card">
    <h1>Resolving your link</h1>
    <p class="sub">Handing off to the destination below.</p>

    <div class="path-track">
      <div class="path-fill"></div>
      <div class="path-node"></div>
    </div>
    <div class="endpoints">
      <span>here</span>
      <span id="destLabel">destination</span>
    </div>

    <div class="route-meta">
      <div class="route-name" id="routeName">—</div>
      <span class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">—</span></span>
    </div>

    <div class="manual-link">
      Not redirected automatically? <a id="manualHref" href="#">Continue manually</a>
    </div>
  </div>
</div>

<!-- DIRECTORY VIEW -->
<div class="directory" id="directoryScene">
  <div class="directory-head">
    <h1>My Projects</h1>
    <p>A collection of things I've built. Tap a card for more detail, or filter by tag below.</p>
  </div>
  <div class="filter-bar" id="filterBar"></div>
  <div class="route-table" id="routeTable"></div>
  <div class="directory-foot" id="invalidNote"></div>
</div>

<script>
  // Theme toggle — kept in memory for this session (no browser storage).
  (function () {
    const root = document.documentElement;
    const switchEl = document.getElementById("themeSwitch");
    const labelEl = document.getElementById("themeLabel");

    function applyTheme(theme) {
      if (theme === "light") {
        root.setAttribute("data-theme", "light");
      } else {
        root.removeAttribute("data-theme");
      }
      labelEl.textContent = theme;
    }

    let current = "dark";
    applyTheme(current);

    switchEl.addEventListener("click", () => {
      current = current === "dark" ? "light" : "dark";
      applyTheme(current);
    });
  })();

  const routes = {

    "advaithhomes-co-uk": {

      status: "live",
      type: "Business Page",
      show: true,
      logo: "http://advaithhomes.co.uk/wp-content/themes/advaithhomes_new/assets/images/logos/logo_with_text.png?v=22",
      desc: "Live client site — UK project.",
      about: "A UK property information and buyer-support platform. It offers independent guides, checklists, and calculators (stamp duty, deposit savings, affordability) for buying, selling, and moving, plus buyer-side services — property search, negotiation, and transaction coordination through to completion. Built for first-time buyers, home movers, landlords, and expats.",
      tools: ["WordPress", "SEO"],
      tags: ["client", "UK project"]
    },
    "thecanehouse-co-uk": {
      name: "The Cane House",
      url: "http://thecanehouse.co.uk",
      status: "upcoming",
      type: "Business Page",
      show: true,
      logo: "https://thecanehouse.co.uk/wp-content/themes/ah_canehouse/assets/images/logo.png",
      desc: "Not live yet."
    }
  };

  // Central place to add new statuses.
  // detail: "full" shows about/type/tools/tags/case-study in the Info panel.
  // detail: "minimal" shows only the short desc + the status note.
  // Go button enabled/disabled is NOT decided here — see hasUrl() below.
  // It's purely based on whether the route has a real url set.
  const STATUS_CONFIG = {
    live:     { label: "live",     note: null, detail: "full" },
    demo:     { label: "demo",     note: null, detail: "full" },
    sample:   { label: "sample",   note: "This is sample / placeholder content, not the real thing.", detail: "full" },
    upcoming: { label: "upcoming", note: "Not live yet — check back soon.", detail: "minimal" },
    expired:  { label: "expired",  note: "This link is no longer active.", detail: "minimal" }
  };

  // A route is redirectable if it has a usable url. Status no longer
  // gates the Go button — only presence of a real link does.
  function hasUrl(route) {
    return !!(route && typeof route.url === "string" && route.url.trim().length > 0);
  }

  const REDIRECT_DELAY = 1500;
  let activeTag = null;

  function shortUrl(u) {
    return u.replace(/^https?:\/\//, "");
  }

  function showRedirect(key) {
    document.getElementById("body").classList.add("centered");
    const route = routes[key];
    const statusCfg = STATUS_CONFIG[route.status] || { label: route.status, note: null, detail: "full" };
    const canGo = hasUrl(route);
    document.getElementById("redirectScene").style.display = "block";

    document.getElementById("routeName").textContent = route.name;
    document.getElementById("destLabel").textContent = canGo ? shortUrl(route.url) : "—";
    if (canGo) document.getElementById("manualHref").href = route.url;

    const pill = document.getElementById("statusPill");
    const statusText = document.getElementById("statusText");
    pill.classList.add(route.status);
    statusText.textContent = statusCfg.label;

    document.title = route.name + " — Routing";

    if (!canGo) {
      // No real link to send anyone to — explain why, regardless of status.
      document.querySelector(".router-card h1").textContent = "This link isn't ready";
      document.querySelector(".router-card .sub").textContent = "There's no destination set for this route yet.";
      document.querySelector(".path-track").style.display = "none";
      document.querySelector(".endpoints").style.display = "none";
      document.querySelector(".manual-link").innerHTML = `<a href="?">Browse all routes</a> instead.`;
      return;
    }

    setTimeout(() => {
      window.location.href = route.url;
    }, REDIRECT_DELAY);
  }

  function visibleEntries() {
    // show: false hides a route from the directory entirely. Omitted or
    // true means visible. Direct-link (?to=) access is unaffected.
    return Object.entries(routes).filter(([, r]) => r.show !== false);
  }

  function holdKey() {
    // If any VISIBLE route has hold: true, the directory isolates to just that one.
    const hit = visibleEntries().find(([, r]) => r.hold === true);
    return hit ? hit[0] : null;
  }

  function allTags() {
    const counts = {};
    visibleEntries().forEach(([, r]) => {
      (r.tags || []).forEach(t => { counts[t] = (counts[t] || 0) + 1; });
    });
    return counts;
  }

  function renderFilterBar() {
    const bar = document.getElementById("filterBar");
    if (holdKey()) { bar.style.display = "none"; return; }
    const counts = allTags();
    const tags = Object.keys(counts).sort();
    if (tags.length === 0) { bar.style.display = "none"; return; }

    const allChip = `<span class="tag-chip ${activeTag === null ? "active" : ""}" data-tag="">all<span class="count">${visibleEntries().length}</span></span>`;
    const chips = tags.map(t =>
      `<span class="tag-chip ${activeTag === t ? "active" : ""}" data-tag="${t}">${t}<span class="count">${counts[t]}</span></span>`
    ).join("");
    bar.innerHTML = allChip + chips;

    bar.querySelectorAll(".tag-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        const t = chip.getAttribute("data-tag");
        activeTag = t === "" ? null : t;
        renderFilterBar();
        renderTable();
      });
    });
  }

  function renderTable() {
    const table = document.getElementById("routeTable");
    const hk = holdKey();
    const entries = hk
      ? [[hk, routes[hk]]]
      : visibleEntries();
    const visible = (!hk && activeTag)
      ? entries.filter(([, r]) => (r.tags || []).includes(activeTag))
      : entries;

    if (visible.length === 0) {
      table.innerHTML = `<div class="no-results">No routes tagged "${activeTag}".</div>`;
      return;
    }

    // Logo if set, otherwise falls back to the numbered index badge.
    // onerror swaps a broken image link back to the number too.
    function iconHtml(r, i) {
      if (!r.logo) {
        return `<span class="row-index">${String(i + 1).padStart(2, "0")}</span>`;
      }
      const fallback = String(i + 1).padStart(2, "0");
      return `<span class="row-logo"><img src="${r.logo}" alt="" onerror="this.parentElement.outerHTML='&lt;span class=&quot;row-index&quot;&gt;${fallback}&lt;/span&gt;'"></span>`;
    }

    table.innerHTML = visible.map(([key, r], i) => {
      const statusCfg = STATUS_CONFIG[r.status] || { label: r.status, note: null, detail: "full" };

      // direct: true -> minimal row, name + Go button, no card/tags/details at all.
      if (r.direct) {
        const canGoDirect = hasUrl(r);
        const goBtn = canGoDirect
          ? `<a class="go-btn" href="?to=${encodeURIComponent(key)}">Go</a>`
          : `<span class="go-btn" style="opacity:.4;pointer-events:none;">Go</span>`;
        const typeBadgeDirect = r.type ? `<span class="type-badge">${r.type}</span>` : "";
        return `
          <div class="route-item ${!canGoDirect ? "status-" + r.status : ""}" data-key="${key}">
            <div class="route-row direct-row">
              <div class="row-top">
                ${iconHtml(r, i)}
                <span class="row-main">
                  <div class="row-name">${r.name}</div>
                </span>
              </div>
              <div class="row-bottom">
                <span class="row-badges">
                  <span class="status-pill ${r.status}"><span class="dot"></span><span>${statusCfg.label}</span></span>
                  ${typeBadgeDirect}
                </span>
                <span class="row-actions">${goBtn}</span>
              </div>
            </div>
          </div>
        `;
      }

      const canGo = hasUrl(r);
      const isFull = statusCfg.detail === "full";

      const hasDetail = isFull
        ? (r.about || r.caseStudy || (r.tools && r.tools.length) || (r.tags && r.tags.length) || r.type || !canGo)
        : (r.desc || (!canGo && statusCfg.note)); // minimal: only show Info if there's something to say at all

      const typeRowHtml = (isFull && r.type)
        ? `<div class="detail-row"><span class="detail-label">Type</span><span class="detail-desc" style="margin:0;">${r.type}</span></div>`
        : "";
      const toolsHtml = (isFull && r.tools && r.tools.length)
        ? `<div class="detail-row"><span class="detail-label">Tools</span><span class="tool-list">${r.tools.map(t => `<span class="tool-badge">${t}</span>`).join("")}</span></div>`
        : "";
      const tagsHtml = (isFull && r.tags && r.tags.length)
        ? `<div class="detail-row"><span class="detail-label">Tags</span><span class="tag-list">${r.tags.map(t => `<span class="tag-badge">${t}</span>`).join("")}</span></div>`
        : "";
      const noteHtml = (!canGo && statusCfg.note)
        ? `<div class="detail-row"><span class="detail-label">Status</span><span class="detail-desc" style="margin:0;">${statusCfg.note}</span></div>`
        : "";
      const caseStudyHtml = (isFull && r.caseStudy)
        ? `<div class="case-study-toggle" data-role="case-toggle"><span class="chev">›</span> Read case study</div>
           <div class="case-study-body"><div class="case-study-inner">${r.caseStudy}</div></div>`
        : "";

      // For minimal-detail statuses, show the plain desc; "about" is withheld
      // since it's meant for finished/available projects.
      const mainText = isFull ? (r.about || r.desc || "") : (r.desc || "");

      const goRowBtn = canGo
        ? `<a class="go-btn" data-role="go-btn" href="?to=${encodeURIComponent(key)}">Go</a>`
        : `<span class="go-btn" style="opacity:.4;pointer-events:none;">Go</span>`;

      const typeBadge = r.type ? `<span class="type-badge">${r.type}</span>` : "";
      const rowTagBadges = (r.tags && r.tags.length)
        ? r.tags.map(t => `<span class="row-tag-badge">${t}</span>`).join("")
        : "";

      return `
        <div class="route-item ${!canGo ? "status-" + r.status : ""}" data-key="${key}">
          <div class="route-row" data-role="toggle">
            <div class="row-top">
              ${iconHtml(r, i)}
              <span class="row-main">
                <div class="row-name">${r.name}</div>
                <div class="row-url">${shortUrl(r.url)}</div>
              </span>
            </div>
            <div class="row-bottom">
              <span class="row-badges">
                <span class="status-pill ${r.status}"><span class="dot"></span><span>${statusCfg.label}</span></span>
                ${typeBadge}
                ${rowTagBadges}
              </span>
              <span class="row-actions">
                ${goRowBtn}
                <span class="info-toggle">${hasDetail ? `Info <span class="row-toggle">›</span>` : ""}</span>
              </span>
            </div>
          </div>
          ${hasDetail ? `
          <div class="route-detail">
            <div class="route-detail-inner">
              ${mainText ? `<p class="detail-desc">${mainText}</p>` : ""}
              ${typeRowHtml}
              ${noteHtml}
              ${toolsHtml}
              ${tagsHtml}
              ${caseStudyHtml}
            </div>
          </div>` : ""}
        </div>
      `;
    }).join("");

    // Go buttons are plain links — stop their click from bubbling up
    // to the row's expand/collapse toggle.
    table.querySelectorAll('[data-role="go-btn"]').forEach(btn => {
      btn.addEventListener("click", (e) => e.stopPropagation());
    });

    table.querySelectorAll(".route-item").forEach(item => {
      const toggle = item.querySelector('[data-role="toggle"]');
      if (!toggle) return; // direct rows have no toggle — the Go button is a plain link
      const hasDetail = item.querySelector(".route-detail");
      const key = item.getAttribute("data-key");
      const route = routes[key];

      if (!hasDetail) {
        // Only bare-link straight to the destination if a real url exists.
        toggle.addEventListener("click", () => {
          if (hasUrl(route)) {
            window.location.href = "?to=" + encodeURIComponent(key);
          }
        });
        return;
      }
      toggle.addEventListener("click", () => {
        item.classList.toggle("open");
      });
    });

    table.querySelectorAll('[data-role="case-toggle"]').forEach(caseToggle => {
      caseToggle.addEventListener("click", (e) => {
        e.stopPropagation(); // don't also collapse the parent card
        caseToggle.classList.toggle("open");
        caseToggle.nextElementSibling.classList.toggle("open");
      });
    });
  }

  function showDirectory(invalidKey) {
    document.getElementById("body").classList.remove("centered");
    const scene = document.getElementById("directoryScene");
    scene.style.display = "block";

    const hk = holdKey();
    const headP = document.querySelector(".directory-head p");
    const foot = document.getElementById("invalidNote");

    if (hk) {
      document.title = routes[hk].name;
      headP.textContent = "Currently spotlighting one project.";
      renderFilterBar();
      renderTable();
      foot.textContent = "";
      return;
    }

    document.title = "My Projects";
    headP.textContent = "A collection of things I've built. Tap a card for more detail, or filter by tag below.";

    renderFilterBar();
    renderTable();
    foot.textContent = "";
  }

  const params = new URLSearchParams(window.location.search);
  const target = params.get("to");

  if (target && routes[target]) {
    showRedirect(target);
  } else {
    showDirectory(target);
  }
</script>
</body>
</html>
